extract_job_requirements:
  description: 'Analyze the job description below together with the recruiter''s structured
    requirements, and produce a single Unified Requirements Profile.


    Job Description:

    {job_description}


    Recruiter''s structured requirements (captured on a form — these OVERRIDE the
    job description wherever the two conflict; the JD fills any gaps the form leaves
    open):

    {recruiter_requirements}


    Extract and organize the following fields:

    - **Required Skills**: Non-negotiable technical and soft skills. Mark each skill
    core=true ONLY when it is central to the role: it appears in the job title, is
    described as the primary day-to-day function, or is listed in the recruiter''s
    structured must-have skills. Supporting tools and secondary skills (version
    control, familiarity-level items, collaboration tools) are core=false. Most
    roles have 1-4 core skills.

    - **Preferred / Nice-to-Have Skills**: Skills mentioned as a bonus or "plus".

    - **Minimum Years of Experience**: The lowest acceptable experience level.

    - **Location**: Office city/region or "Remote", plus commute/relocation rules.

    - **Work Mode**: On-site / Hybrid / Remote.

    - **Work Authorization**: Any visa / right-to-work / employment-type requirements.

    - **Education Requirements**: Degree level and field if specified.

    - **Must-Haves**: Hard requirements beyond skills (certifications, licenses, availability,
    shift, notice period, legal work authorization).

    - **Nice-to-Haves**: Additional desirable qualities that are not blockers.

    - **Compensation Budget**: If provided (flag-only — candidates are never rejected
    on compensation).


    If any field is not mentioned in either source, mark it as "Not specified".

    ABSOLUTE RULE — Minimum Years of Experience: state a numeric minimum ONLY if
    that exact number appears verbatim in the job description or the recruiter''s
    structured requirements (e.g. "3+ years", "minimum 2 years"). Phrases like
    "production experience", "hands-on experience", or "proven track record" are
    NOT numeric minimums — for those, write exactly "Not specified". NEVER infer,
    estimate, or invent a number of years. The same applies to Must-Haves: never
    add an experience-duration must-have that neither source states numerically.'
  expected_output: A structured Unified Requirements Profile with every extracted
    field filled in. List fields hold short, concrete items (one skill or requirement
    per item, no prose); scalar fields hold a short phrase or exactly "Not specified".
    The summary is 2-3 plain-language sentences describing the role. Be terse and
    factual — extract, never elaborate.
  agent: senior_technical_recruiter
