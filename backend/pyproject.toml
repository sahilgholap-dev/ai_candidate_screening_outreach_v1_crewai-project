[project]
name = "ai_candidate_screening_outreach"
version = "0.1.0"
description = "Multi-tenant AI candidate screening and outreach platform (CrewAI)"
authors = [{ name = "Sahil Gholap", email = "sahil.gholap@mastertech.co.in" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[anthropic,file-processing,litellm,tools]==1.15.0",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "jinja2",
    "sqlalchemy",
    "pypdf",
    "python-docx",
    "selenium>=4.45.0",
    "webdriver-manager>=4.1.2",
    "tqdm>=4.68.3",
    "requests>=2.34.2",
    "python-dotenv>=1.2.2",
    "urllib3>=2.7.0",
    "chromedriver-autoinstaller>=0.6.4",
    "alembic>=1.18.5",
]

[project.scripts]
ai_candidate_screening_outreach = "ai_candidate_screening_outreach.main:run"
run_crew = "ai_candidate_screening_outreach.main:run"
train = "ai_candidate_screening_outreach.main:train"
replay = "ai_candidate_screening_outreach.main:replay"
test = "ai_candidate_screening_outreach.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.uv]
override-dependencies = ["litellm<=1.82.6"]
